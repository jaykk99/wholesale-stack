services:
  - type: web
    name: wholesale-stack
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WHOLESALE_BUYER_NAME
        sync: false
      - key: WHOLESALE_BUYER_COMPANY
        sync: false
